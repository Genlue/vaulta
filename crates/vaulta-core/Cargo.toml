[package]
name = "vaulta-core"
version = "0.1.0"
edition = "2021"

[dependencies]
dunce = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
