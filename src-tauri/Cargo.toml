[package]
name = "vaulta"
version = "0.3.5"
description = "Local-first personal digital asset library"
edition = "2024"
rust-version = "1.90"
default-run = "vaulta"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "6"
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
glass-design-host = { path = "../crates/glass-design-host" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
vaulta-core = { path = "../crates/vaulta-core" }
vaulta-fs = { path = "../crates/vaulta-fs" }
