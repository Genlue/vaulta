<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>vaulta</title>
  <link rel="icon" href="./assets/vaulta.ico">
  <link rel="stylesheet" href="./vendor/glassdesign/glass.css">
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./window-chrome.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="app" class="shell">
    <div class="topbar" id="topbar">
      <div class="topbar-window" data-tauri-drag-region="deep">
        <div id="window-chrome" hidden data-tauri-drag-region="deep"></div>
        <div class="rail-toggle-track">
          <div id="rail-toggle-slot" data-tauri-drag-region="false"></div>
        </div>
      </div>
      <header class="chrome" id="chrome" data-tauri-drag-region="deep"></header>
    </div>
    <div class="c-topveil" id="topveil" data-on="0" aria-hidden="true"></div>
    <aside class="rail" id="rail" aria-label="仓库导航"></aside>
    <div id="rail-grip"></div>
    <nav class="c-dock" id="dock" data-edge="left" aria-label="主导航" hidden></nav>
    <main class="workspace" id="workspace" aria-label="工作区"></main>
    <div id="inspect-grip" hidden></div>
    <aside class="inspector" id="inspector" aria-label="资产详情" hidden></aside>
    <footer class="status" id="status"></footer>
  </div>
  <dialog id="commands" class="command-dialog" aria-labelledby="commands-title"></dialog>
  <dialog id="modal" class="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="pop" class="c-menu" role="menu" tabindex="-1" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="glass-defs" aria-hidden="true"></div>
</body>
</html>
